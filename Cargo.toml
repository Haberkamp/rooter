[package]
name = "rooter"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
license = "MIT"
readme = "README.md"
description = "A window-scoped router for GPUI applications."
repository = "https://github.com/Haberkamp/rooter"
homepage = "https://github.com/Haberkamp/rooter"
documentation = "https://docs.rs/rooter"
keywords = ["gpui", "router", "routing", "gui"]
categories = ["gui"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
gpui = "0.2.2"
matchit = "0.8.6"
regex = "1.11.2"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }

[[example]]
name = "multi_file"
path = "examples/multi_file/main.rs"
